monitoring:
  cpu_interval_seconds: 0.1
  watchdog_interval_seconds: 300
  thresholds:
    cpu_percent: 90
    memory_percent: 90
    disk_percent: 90

docker:
  include_all: true
  client_timeout_seconds: 10
  restart_timeout_seconds: 10

guardian:
  restart_cooldown_seconds: 300
  max_restart_attempts: 3
  restart_history_path: restart_history.json

incidents:
  history_path: incident_history.json

storage:
  database_path: aegisnex.db
  database_url: ""

notifications:
  email:
    enabled: false
    retry_attempts: 2
    retry_delay_seconds: 1
    timeout_seconds: 10
    host: smtp.gmail.com
    port: 587
    starttls: true
    username: ""
    password: ""
    sender: ""
    recipient: ""
    subject: AegisNex Incident
    message_template: "[{severity}] {service_name}: {description} ({incident_id})"
    resolution_template: "[RESOLVED] {service_name}: {description} ({incident_id})"
  slack:
    enabled: false
    retry_attempts: 2
    retry_delay_seconds: 1
    timeout_seconds: 10
    webhook_url: ""
    message_template: "[{severity}] {service_name}: {description} ({incident_id})"
    resolution_template: "[RESOLVED] {service_name}: {description} ({incident_id})"
  discord:
    enabled: false
    retry_attempts: 2
    retry_delay_seconds: 1
    timeout_seconds: 10
    webhook_url: ""
    message_template: "[{severity}] {service_name}: {description} ({incident_id})"
    resolution_template: "[RESOLVED] {service_name}: {description} ({incident_id})"

health_checks:
  docker:
    enabled: true
  http:
    enabled: false
    timeout_seconds: 5
    expected_status: 200
    endpoints:
  ssl:
    enabled: false
    timeout_seconds: 5
    warning_days: 30
    targets:
  tcp:
    enabled: false
    timeout_seconds: 5
    targets:
