version: '3.8'

services:
  # ============================================================================
  # SERVICE 1: Infrastructure Surface Profiler
  # ============================================================================
  network_recon:
    build:
      context: ../modules/network-recon
      dockerfile: Dockerfile
    volumes:
      - ../data:/data
    command: ["example.invalid"] # Example target host; override with an authorized target.

  # ============================================================================
  # SERVICE 2: Web Application & API Security Auditor
  # ============================================================================
  app_audit:
    build:
      context: ../modules/app-audit
      dockerfile: Dockerfile
    volumes:
      - ../data:/data
    command: ["https://example.invalid"] # Example target URL; override with an authorized target.
    depends_on:
      - network_recon # Enforces sequential pipeline staging
