[project]
name = "aegisnex"
version = "0.1.0"
description = "Open-source infrastructure observability, AI-driven incident response, and autonomous remediation"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "AegisNex Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top (intentional lazy imports throughout codebase)
    "B008",   # do not perform function calls in argument defaults
    "B024",   # abstract class without abstract methods
    "B027",   # empty method in abstract class
    "ARG001", # unused function argument (often needed for interfaces)
    "ARG002", # unused method argument
    "SLF",    # private member access (intentional intra-package usage throughout codebase)
    "N806",   # variable in function should be lowercase
    "N818",   # exception name should end with Error
    "PTH",    # pathlib suggestions (codebase uses os.path correctly where needed)
    "SIM102", # collapsible if
    "SIM117", # multiple with statements
    "A002",   # argument shadows builtin
    "A005",   # module shadows builtin
    "E741",   # ambiguous variable name
    "RUF006", # store a reference to the return value of a function call
    "RUF012", # mutable class attributes should be annotated with ClassVar
    "RUF034", # useless expression
    "UP035",  # deprecated imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "T20"]
"scripts/**/*.py" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "scripts/",
    "node_modules/",
    ".venv/",
    "venv/",
]

[[tool.mypy.overrides]]
module = "src.intelligence.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.agents.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
skip_covered = true
