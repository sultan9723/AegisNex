name: disk-full
description: Investigate and resolve disk space issues
version: "1.0"
category: storage
tags:
  - disk
  - storage
  - cleanup
timeout_seconds: 180
requires_incident: true
steps:
  - name: check-disk-usage
    action: tool
    tool: metrics
    params:
      focus: disk
    description: Check current disk usage
    on_failure: stop
  - name: cleanup-docker
    action: tool
    tool: docker
    params:
      action: cleanup
    description: Clean up unused Docker resources
    requires_approval: true
    on_failure: continue
  - name: verify-disk
    action: tool
    tool: metrics
    params:
      focus: disk
    description: Verify disk usage after cleanup
    on_failure: continue
  - name: close-incident
    action: resolve_incident
    params:
      resolution_notes: "Disk space freed by Docker cleanup"
    description: Close incident
    on_failure: continue
